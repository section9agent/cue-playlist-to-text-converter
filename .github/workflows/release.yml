name: Release

# Builds the app for Windows, macOS (Apple Silicon and Intel) and Linux,
# then attaches everything to a DRAFT release. Nothing is published until
# you open the draft on GitHub and press "Publish release".
#
# Run it from the Actions tab with "Run workflow". Every run picks the next free
# version number by itself (one patch step above the newest release or tag on
# GitHub), so "release already exists" can no longer happen. The version in the
# files is only used for the very first release, or when you set a higher one
# yourself with "npm run bump" (for example to move from 0.1.x to 0.2.0).

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  create-release:
    name: Create draft release
    needs: test
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pick the next version number
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT=$(node -p "require('./src-tauri/tauri.conf.json').version")
          {
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[].tag_name'
            gh api "repos/$GITHUB_REPOSITORY/tags?per_page=100" --paginate --jq '.[].name'
          } > existing.txt
          VERSION=$(node scripts/next-version.mjs "$CURRENT" < existing.txt)
          echo "Version in the files: $CURRENT. Existing: $(sort -u existing.txt | tr '\n' ' ')"
          echo "This release will be v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check the update signing key is set up
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          pubkey=$(node -p "(require('./src-tauri/tauri.conf.json').plugins.updater || {}).pubkey || ''")
          if [ -z "$pubkey" ]; then
            echo "::error::No update public key in src-tauri/tauri.conf.json. On your computer run 'npm install' then 'npm run updater-key', and commit the change. See the README, section 'Automatic updates'."
            exit 1
          fi
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::The repository secret TAURI_SIGNING_PRIVATE_KEY is missing. Add it under Settings > Secrets and variables > Actions. See the README, section 'Automatic updates'."
            exit 1
          fi

      - name: Create or reuse the draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The notes file starts with "## Cue/Playlist to Text Converter vX.Y.Z"; keep it in step.
          sed -i "1s/v[0-9][0-9.]*/v$VERSION/" RELEASE_NOTES.md
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"" | head -n 1 || true)

          if [ -n "$existing" ]; then
            id="${existing% *}"
            is_draft="${existing#* }"
            if [ "$is_draft" != "true" ]; then
              echo "::error::Release $TAG is already published. Bump the version to make a new release."
              exit 1
            fi
            echo "Reusing draft release $TAG ($id)"
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md --title "Cue/Playlist to Text Converter $TAG"
          else
            gh release create "$TAG" \
              --draft \
              --title "Cue/Playlist to Text Converter $TAG" \
              --notes-file RELEASE_NOTES.md \
              --target "$GITHUB_SHA"
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
              --jq ".[] | select(.tag_name == \"$TAG\" and .draft == true) | .id" | head -n 1)
          fi

          if [ -z "${id:-}" ]; then
            echo "::error::Could not find the draft release id."
            exit 1
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: create-release
    strategy:
      fail-fast: false
      max-parallel: 1 # the jobs take turns so they do not overwrite each other's latest.json
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            rust_targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            rust_targets: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            rust_targets: ''
            args: ''
          - name: Windows
            os: windows-latest
            rust_targets: ''
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux libraries
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.name }}

      - run: npm ci

      - name: Set the version, point the app at this repository and list its open source credits
        run: |
          node scripts/bump-version.mjs "${{ needs.create-release.outputs.version }}"
          node scripts/set-repo.mjs
          node scripts/generate-credits.mjs

      - name: Build and upload to the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  summary:
    name: Draft ready
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Point to the draft
        run: |
          {
            echo "### Draft release ${{ needs.create-release.outputs.tag }} is ready"
            echo
            echo "Open **Releases** in the repository, check the files, then press **Publish release**."
          } >> "$GITHUB_STEP_SUMMARY"
